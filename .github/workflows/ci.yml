name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-lint-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-test-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo build --workspace
      - run: cargo test --workspace
      - run: cargo test --workspace -- --test-threads 1

  build:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch: amd64
            cc: ""
          - target: aarch64-unknown-linux-gnu
            arch: arm64
            cc: gcc-aarch64-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: matrix.cc != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.cc }} libc6-dev-arm64-cross
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-build-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Build release binaries
        run: |
          ENV=""
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            ENV="CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc"
          fi
          env $ENV cargo build --release --target ${{ matrix.target }} -p srp -p srp-helper
      - name: Verify binaries
        run: |
          file target/${{ matrix.target }}/release/srp
          file target/${{ matrix.target }}/release/srp-helper
      - name: Package deb
        run: |
          ARCH="${{ matrix.arch }}"
          PKG="dist/srp_0.1.0_${ARCH}"
          mkdir -p "$PKG/DEBIAN" "$PKG/usr/bin" "$PKG/usr/share/doc/srp" \
                   "$PKG/lib/systemd/system" "$PKG/etc/default"
          printf 'Package: srp\nVersion: 0.1.0\nArchitecture: %s\nDepends: libc6 (>= 2.38), systemd\nMaintainer: wakmemlody <dev@agent.local>\nDescription: SSH resilient proxy\n SOCKS5/HTTP CONNECT proxy over SSH with automatic\n reconnection, keepalive, and optional byte-level\n resume via a remote helper binary.\n' "$ARCH" > "$PKG/DEBIAN/control"
          cp target/${{ matrix.target }}/release/srp "$PKG/usr/bin/"
          cp target/${{ matrix.target }}/release/srp-helper "$PKG/usr/bin/"
          chmod 755 "$PKG/usr/bin/srp" "$PKG/usr/bin/srp-helper"
          cp packaging/srp.service "$PKG/lib/systemd/system/srp.service"
          cp packaging/srp.default "$PKG/etc/default/srp"
          cp README.md LICENSE "$PKG/usr/share/doc/srp/"
          dpkg-deb --build "$PKG"
      - uses: actions/upload-artifact@v4
        with:
          name: srp-${{ matrix.arch }}
          path: dist/srp_0.1.0_${{ matrix.arch }}.deb

  build-windows:
    runs-on: windows-latest
    needs: test
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: amd64
          - target: aarch64-pc-windows-msvc
            arch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-build-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
      # ARM64 交叉编译需要 MSVC 的 ARM64 工具集。
      # 用 vswhere 定位实际安装路径，不硬编码版本与 edition：
      # runner 镜像升级后 2022/Enterprise 这类路径随时会变。
      - name: Install ARM64 MSVC tools
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -property installationPath
          if (-not $vsPath) { throw "未找到 Visual Studio 安装路径" }
          Write-Host "VS 安装路径: $vsPath"
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
          $p = Start-Process -FilePath $installer -Wait -PassThru -ArgumentList @(
            'modify', '--installPath', "`"$vsPath`"",
            '--add', 'Microsoft.VisualStudio.Component.VC.Tools.ARM64',
            '--quiet', '--norestart'
          )
          Write-Host "vs_installer 退出码: $($p.ExitCode)"
          # 3010 = 需要重启才完全生效，对命令行编译无影响，视为成功。
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) {
            throw "ARM64 工具集安装失败，退出码 $($p.ExitCode)"
          }
          # 确认 ARM64 链接器确实落地了，否则后面的报错会很难懂。
          $link = Get-ChildItem "$vsPath\VC\Tools\MSVC\*\bin\Hostx64\arm64\link.exe" -ErrorAction SilentlyContinue |
                  Select-Object -First 1
          if (-not $link) { throw "ARM64 link.exe 未找到，工具集没装上" }
          Write-Host "ARM64 链接器: $($link.FullName)"
      - name: Build release binaries
        run: cargo build --release --target ${{ matrix.target }} -p srp -p srp-helper
      - name: Verify binaries
        run: |
          Get-Item target/${{ matrix.target }}/release/srp.exe | Select-Object Name, Length
          Get-Item target/${{ matrix.target }}/release/srp-helper.exe | Select-Object Name, Length
      - name: Package zip
        shell: pwsh
        run: |
          $ARCH = "${{ matrix.arch }}"
          $PKG = "dist/srp_0.1.0_windows_${ARCH}"
          New-Item -ItemType Directory -Force -Path "$PKG" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/srp.exe" "$PKG/"
          Copy-Item "target/${{ matrix.target }}/release/srp-helper.exe" "$PKG/"
          Copy-Item "README.md" "$PKG/"
          Copy-Item "LICENSE" "$PKG/"
          Copy-Item "packaging/WINDOWS.md" "$PKG/使用说明.md"
          Compress-Archive -Path "$PKG/*" -DestinationPath "dist/srp_0.1.0_windows_${ARCH}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: srp-windows-${{ matrix.arch }}
          path: dist/srp_0.1.0_windows_${{ matrix.arch }}.zip

  release:
    runs-on: ubuntu-latest
    needs: [build, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/srp-*/srp_0.1.0_amd64.deb
            dist/srp-*/srp_0.1.0_arm64.deb
            dist/srp-windows-*/srp_0.1.0_windows_amd64.zip
            dist/srp-windows-*/srp_0.1.0_windows_arm64.zip
